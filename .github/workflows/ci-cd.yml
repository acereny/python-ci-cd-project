name: Python CI/CD Pipeline

on:
  push:

permissions:
  contents: read

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Get repository code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run Unit Test
        run: python -m pytest test_unit.py -v

      - name: Run Selenium UI Test
        run: python -m pytest test_ui.py -v

      - name: Deployment confirmation
        run: echo "All tests passed! Application successfully deployed to production."
