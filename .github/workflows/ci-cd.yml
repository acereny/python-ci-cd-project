name: Python CI/CD Pipeline

on:
  push:

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Get repository code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run Unit Test
        run: python -m pytest test_unit.py -v

      - name: Run Selenium UI Test
        run: python -m pytest test_ui.py -v

      - name: Deployment confirmation
        if: ${{ success() }}
        run: |
          echo "All tests passed! Application successfully deployed to production."